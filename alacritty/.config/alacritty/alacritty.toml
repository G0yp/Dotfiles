[env]
TERM = "xterm-256color"

[window]
opacity = 0.9
startup_mode = "Maximized"
padding = {x=5,y=5}

[mouse]
hide_when_typing = true

[font]
normal = {family = "SFMono Nerd Font Mono", style = "regular"}

[general]
#import = ["~/.config/alacritty/catppuccin-frappe.toml"]
import = ["~/.config/alacritty/colors.toml"]
