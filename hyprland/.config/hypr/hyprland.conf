# This is an example Hyprland config file. Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/
# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf ############### ## MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-4, 2560x1440@144, 0x0, 1
monitor = eDP-1, 2560x1600@144, 2560x0, 1 
monitor = DP-3, 1920x1080@60, -1920x360, 1

workspace = 1, monitor:DP-4
workspace = 2, monitor:eDP-1
workspace = 3, monitor:DP-3

################### ## MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
# Set programs that you use
$terminal = alacritty
$menu = wofi --show drun


#################
### AUTOSTART ###
#################
#
# exec-once = hyprpaper 
exec-once = hyprpm reload -n
exec-once = ignis init

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT , auto


#####################
### LOOK AND FEEL ###
#####################

plugin {
    hy3{
        no_gaps_when_only = 0
        tab_first_window = false

        tabs{
            text_font = JetBrains mono
            col.active = 0xffcf8670
        }
    }
}


# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 2
    gaps_out = 3

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ffffffee)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = hy3
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = .95

    #shadow {
    #enabled = false

    #}
    
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
#animations {
#    enabled = yes
#
#    bezier = quart, 0.25, 1, 0.5, 1
#
#    animation = windows, 1, 6, quart, slide
#    animation = border, 1, 6, quart
#    animation = borderangle, 1, 6, quart
#    animation = fade, 1, 6, quart
#    animation = workspaces, 1, 6, quart
#}
animations {
    enabled = yes

    bezier = quart, 0.25, 1, 0.5, 1

    bezier = linear, 0.0, 0.0, 1.0, 1.0
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    bezier = cubic, 0.54, 0.22, 0.07, 0.74

    bezier = overshotCircle, 0.175, 0.885, 0.32, 1.275

    bezier = md3_standard, 0.2, 0.0, 0, 1.0

    bezier= bounce, 1, 1.6, 0.1, 0.85

    bezier = decel, 0.05, 0.7, 0.1, 1

    animation = windowsIn, 1, 3, bounce, popin 23%
#    animation = windowsOut, 1, 7, bounce, slide
    animation = windows, 1, 3, quart, slide
    animation = workspaces, 1, 4, quart
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
#
input {
    kb_layout = us
    kb_variant =
    kb_model =
    #kb_options = caps:swapescape
    kb_rules =
    

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    no_hardware_cursors = true
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, E, togglefloating,
bind = $mainMod SHIFT, D, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, X, exec, hyprlock
bind = $mainMod, P, exec, ignis init
bind = $mainMod SHIFT, P, exec, killall ignis
bind = $mainMod, D, exec, ignis toggle ignis_LAUNCHER
bind = $mainMod, G, exec, walker
bind = $mainMod, U, exec, ags
bind = $mainMod SHIFT, U, exec, killall ags

# Move focus with mainMod + HJKL
bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, L, hy3:movefocus, r
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, J, hy3:movefocus, d

# Move window with mainMod + SHIFT + HJKL
bind = $mainMod SHIFT, H, hy3:movewindow, l
bind = $mainMod SHIFT, L, hy3:movewindow, r
bind = $mainMod SHIFT, K, hy3:movewindow, u
bind = $mainMod SHIFT, J, hy3:movewindow, d

# Change window split direction with mainMod + V
bind = $mainMod, V, hy3:makegroup, opposite, ephemeral

# Make a tab group with mainMod + W
bind = $mainMod, W, hy3:makegroup, tab, ephemeral

# Center a window with mainMod + C
bind = $mainMod, C, centerwindow
bind = $mainMod, C, exec, hyprctl --batch "dispatch centerwindow 1 ; dispatch resizeactive exact 70% 70%"

# Change focus up or down with A or SHIFT A
bind = $mainMod, A, hy3:changefocus, raise
bind = $mainMod SHIFT, A, hy3:changefocus, lower

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


# will switch to a submap called resize
bind = $mainMod, R, submap, resize

# will start a submap called "resize"
submap = resize

# sets repeatable binds for resizing the active window
binde = , L, resizeactive, 10 0
binde = , H, resizeactive, -10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10

binde = SHIFT, L, resizeactive, 50 0
binde = SHIFT, H, resizeactive, -50 0
binde = SHIFT, K, resizeactive, 0 -50
binde = SHIFT, J, resizeactive, 0 50

# use reset to go back to the global submap
bind = , escape, submap, reset 

# will reset the submap, which will return to the global submap
submap = reset

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
